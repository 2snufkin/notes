<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <title>Document</title>
    <style>
        :root {
            --color-gray-5: #303843;
            --color-orange: #F77951;
            --color-gray-2: #f1f1f1;
            --color-gray-1: #e6ebeb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background-color: var(--color-gray-1);
        }

        .container {
            position: relative;
            /* Ensures the child div is positioned relative to the parent */

            width: 400px;
            margin: 200px auto;
            background-color: var(--color-gray-5);
            border-radius: 1cap;
        }

        .form_card {
            position: absolute;
            margin: 100px 50px;
            background-color: var(--color-gray-5);
            color: var(--color-gray-2);
            text-align: center;


        }

        p {
            padding: 10px;
            font-size: 14px;

        }

        h1 {
            font-weight: 100;
            font-size: 24px;
        }

        button {
            background-color: var(--color-orange);
            padding: 10px;
            color: #f1f1f1;
            width: 100%;
            margin-top: 10px;
            border: none;
            /* Removes the border */
            outline: none;
            /* Removes the focus outline */



        }



        input {
            width: 100%;
            padding: 10px;
            border-radius: 2px;
            outline: none;
            border: none;

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form_card">
            <h1>Need to hire freelancer?</h1>
            <p>Sign up, type in and just say what you want and we will deliver it</p>
            <input type="text" placeholder="What do you want to be done?" />
            <button>Post a Project</button>
        </div>
    </div>

</body>

</html>
